name: Deploy SDK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sdk-macos:
    name: SDK (macOS)
    runs-on: macos-13
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: "https://storage.yandexcloud.net"
      AWS_DEFAULT_BUCKET: ${{ secrets.YC_BUCKET_NAME }}
      AWS_DEFAULT_REGION: "ru-central1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      - name: Initialize vcpkg submodule
        run: git submodule update --init

      - name: Bootstrap vcpkg
        run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install system dependencies and tools
        run: |
          brew install pkg-config autoconf autoconf-archive automake libtool

      - name: Install dependencies
        run: ./vcpkg/vcpkg install --triplet=x64-mac

      - name: Export installed packages to ZIP archive
        run: |
          ./vcpkg/vcpkg export --raw --output-dir=. --output=.sdk
          zip -r sdk.zip .sdk

      - name: Upload SDK to Yandex Cloud Bucket
        shell: bash
        run: |
          archive=sdk.zip
          objectKey="sdk/macos13"
          aws s3 cp "${archive}" "s3://${{ secrets.YC_BUCKET_NAME }}/${objectKey}" --endpoint-url https://storage.yandexcloud.net
