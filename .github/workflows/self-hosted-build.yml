name: "Self hosted build"
on:
  workflow_dispatch:

jobs:
  job:
    name: "Windows-2022"
    runs-on: self-hosted-windows2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: Install dependencies
        shell: pwsh
        run: New-Item -ItemType SymbolicLink -Path "${{ github.workspace }}\.sdk" -Target "$env:USERPROFILE\.sdk"
      - name: Build, test and package
        run: cmake --workflow --preset ci-windows-sdk

  job:
    name: "Ubuntu-24.04"
    runs-on: self-hosted-ubuntu24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
      - name: Install dependencies
        run: ln -s $HOME/.sdk ${{ github.workspace }}/.sdk
      - name: Build, test and package
        run: cmake --workflow --preset ci-linux-sdk
