name: Windows Build
on:
  workflow_dispatch:

jobs:
  build-with-sdk:
    runs-on: windows-2022
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.YC_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_SECRET_ACCESS_KEY }}
      AWS_ENDPOINT_URL: https://storage.yandexcloud.net
      AWS_DEFAULT_BUCKET: ${{ secrets.YC_BUCKET_NAME }}
      AWS_DEFAULT_REGION: ru-central1
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: lukka/get-cmake@latest
      - name: Download SDK from Yandex Cloud Bucket
        shell: pwsh
        run: |
          aws s3 cp "s3://${{ secrets.YC_BUCKET_NAME }}/sdk/windows2022" "${{ runner.temp }}/sdk.zip"
          Expand-Archive -Path "${{ runner.temp }}/sdk.zip" -DestinationPath "${{ github.workspace }}"
          Remove-Item -Path "${{ runner.temp }}/sdk.zip" -Force
      - name: Install NSIS
        uses: negrutiu/nsis-install@v2
        with:
          distro: official
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install WiX Toolset v4
        run: |
          dotnet tool install --global wix --version 4.0.4
          wix extension add --global WixToolset.UI.wixext/4.0.4
      - name: Build, test and package
        run: cmake --workflow --preset ci-windows-sdk
      - name: Rename artifacts for release (strip version)
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Push-Location build/windows-sdk
          $msi = Get-Item "numgeom-${version}-win64.msi" -ErrorAction Stop
          $zip = Get-Item "numgeom-${version}-win64.zip" -ErrorAction Stop
          Copy-Item $msi.FullName "numgeom-win64.msi"
          Copy-Item $zip.FullName "numgeom-win64.zip"
          Pop-Location
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          working_directory: build/windows-sdk
          files: |
            numgeom-win64.msi
            numgeom-win64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
